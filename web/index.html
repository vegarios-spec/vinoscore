<!doctype html>
<html lang="es-MX" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141516" />
    <meta name="description" content="VinoScore: estima si un caldo de vino blanco es prometedor." />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <title>VinoScore</title>
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee en claro.
      try {
        if (localStorage.getItem("vinoscore.tema") === "claro") document.documentElement.dataset.tema = "claro";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
